<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>피자설기맵</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:#2b2622;background:#fffaf5}
header{padding:18px 18px 14px;background:#fff;border-bottom:1px solid #eee;position:relative;z-index:5}
h1{margin:0;font-size:25px} .sub{margin-top:5px;color:#857c74;font-size:13px}
#map{height:48vh;min-height:360px;background:#f3eee8}
.controls{padding:12px 14px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:4}
.search{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:13px;font-size:15px}
.chips{display:flex;gap:7px;overflow:auto;padding-top:10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid #e6ddd5;background:#fff;padding:7px 11px;border-radius:999px;font-size:13px}.chip.active{background:#332a24;color:#fff;border-color:#332a24}
.legend{font-size:12px;color:#736a62;padding-top:9px}.count{padding:12px 16px 2px;color:#756c64;font-size:13px}
#list{padding:8px 14px 30px;display:grid;gap:10px}.card{background:#fff;border:1px solid #eadfd6;border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(60,40,20,.04)}
.card h3{margin:0 0 5px;font-size:17px}.meta{font-size:13px;color:#746a62;line-height:1.55}.badge{display:inline-block;margin-top:9px;padding:5px 9px;border-radius:999px;font-size:12px;background:#eef8ef;color:#28763c}
.badge.yellow{background:#fff7dc;color:#8b6b00}.links{display:flex;gap:8px;margin-top:10px}.links a{font-size:12px;text-decoration:none;color:#5d4b3d;border:1px solid #ddd;padding:6px 9px;border-radius:9px}
.pin{width:48px;height:48px;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));cursor:pointer;transform:translate(-24px,-42px)}
.popup{background:#fff;border:1px solid #ddd;border-radius:12px;padding:10px 12px;box-shadow:0 3px 14px rgba(0,0,0,.18);min-width:170px;font-size:12px;transform:translate(-50%,-115%)}
.popup b{font-size:14px}.notice{margin:12px 14px 30px;padding:12px;border-radius:12px;background:#f7f2ed;color:#776d65;font-size:12px;line-height:1.55}
#error{display:none;margin:10px 14px;padding:12px;background:#fff1f1;color:#9a3434;border-radius:12px;font-size:13px}
@media(min-width:850px){#map{height:55vh}#list{grid-template-columns:repeat(2,minmax(0,1fr));max-width:1000px;margin:auto}.controls{padding-left:max(14px,calc((100% - 1000px)/2));padding-right:max(14px,calc((100% - 1000px)/2))}.count{max-width:1000px;margin:auto}}
</style>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=52d8a41e10f4580819410363384c38d4&libraries=services&autoload=false"></script>
</head>
<body>
<header><h1>🍕 피자설기맵</h1><div class="sub">전국 피자설기 판매처를 지도에서 찾아보세요 · 데이터는 수시로 업데이트돼요</div></header>
<div id="map"></div>
<div id="error"></div>
<div class="controls">
<input id="q" class="search" placeholder="매장명 · 지역 · 시장 검색">
<div id="chips" class="chips"></div>
<div class="legend">🟢 최근 판매 확인 · 🟡 추가 확인 필요 · 판매/재고는 방문 전 매장에 확인해주세요.</div>
</div>
<div id="count" class="count"></div>
<div id="list"></div>
<div class="notice">온라인 정보는 변경될 수 있습니다. 표시된 상태는 마지막 확인 당시의 정보이며, 당일 판매·재고를 보장하지 않습니다. 방문 전 매장에 확인해주세요.</div>
<script>
const SUPABASE_URL='https://gkhvlugymihdslwknmmu.supabase.co';
const SUPABASE_KEY='sb_publishable_UVvUNybYa88I5JcYYjRUuA_fq6Av5MH';
let stores=[], filtered=[], map, overlays=[], infoOverlay=null;
const regions=['전체','서울','부산','인천','경기','대전','울산','대구','경북','경남','전북','강원'];
let region='전체';

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function statusClass(s){return /확인 필요|과거|미확인/.test(s||'')?'yellow':''}
function statusIcon(s){return /최근 판매 확인/.test(s||'')?'🟢':/종료/.test(s||'')?'🔴':'🟡'}

function makeChips(){
 const el=document.getElementById('chips');
 el.innerHTML=regions.map(r=>`<button class="chip ${r===region?'active':''}" data-r="${r}">${r}</button>`).join('');
 el.querySelectorAll('button').forEach(b=>b.onclick=()=>{region=b.dataset.r;makeChips();render()});
}

async function loadStores(){
 const res=await fetch(`${SUPABASE_URL}/rest/v1/stores?select=*&is_visible=eq.true&order=id.asc`,{
   headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}
 });
 if(!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
 stores=await res.json();
 render();
}

function render(){
 const q=document.getElementById('q').value.trim().toLowerCase();
 filtered=stores.filter(s=>(region==='전체'||s.region===region)&&(!q||[s.name,s.region,s.market,s.address].some(v=>(v||'').toLowerCase().includes(q))));
 document.getElementById('count').textContent=`총 ${filtered.length}곳`;
 document.getElementById('list').innerHTML=filtered.map(s=>`
 <article class="card">
  <h3>${esc(s.name)}</h3>
  <div class="meta">${esc(s.region||'')}${s.market?' · '+esc(s.market):''}<br>${esc(s.address||'주소 확인 필요')}</div>
  <span class="badge ${statusClass(s.status)}">${statusIcon(s.status)} ${esc(s.status||'확인 필요')}</span>
  ${s.price?`<div class="meta" style="margin-top:7px">가격: ${esc(s.price)}</div>`:''}
  ${s.last_checked?`<div class="meta">마지막 확인: ${esc(s.last_checked)}</div>`:''}
  <div class="links">
   ${s.source_url?`<a href="${esc(s.source_url)}" target="_blank" rel="noopener">출처 보기</a>`:''}
   <a href="https://map.kakao.com/link/search/${encodeURIComponent(s.name+' '+(s.address||''))}" target="_blank" rel="noopener">카카오맵 검색</a>
  </div>
 </article>`).join('');
 drawPins();
}

function drawPins(){
 if(!map)return;
 overlays.forEach(o=>o.setMap(null)); overlays=[];
 const bounds=new kakao.maps.LatLngBounds(); let n=0;
 filtered.forEach(s=>{
   if(!Number.isFinite(+s.latitude)||!Number.isFinite(+s.longitude))return;
   const pos=new kakao.maps.LatLng(+s.latitude,+s.longitude);
   const content=document.createElement('img');
   content.src='pizza-seolgi-pin.png'; content.className='pin'; content.alt=s.name;
   content.onerror=()=>{content.style.display='none'};
   content.onclick=()=>{
     if(infoOverlay) infoOverlay.setMap(null);
     const p=document.createElement('div'); p.className='popup';
     p.innerHTML=`<b>${esc(s.name)}</b><br>${esc(s.region||'')}${s.market?' · '+esc(s.market):''}<br>${statusIcon(s.status)} ${esc(s.status||'확인 필요')}`;
     infoOverlay=new kakao.maps.CustomOverlay({position:pos,content:p,yAnchor:1});
     infoOverlay.setMap(map);
   };
   const o=new kakao.maps.CustomOverlay({position:pos,content:content,yAnchor:0});
   o.setMap(map); overlays.push(o); bounds.extend(pos); n++;
 });
 if(n>1) map.setBounds(bounds,60,60,60,60);
 else if(n===1) map.setCenter(bounds.getSouthWest());
}

function initMap(){
 map=new kakao.maps.Map(document.getElementById('map'),{center:new kakao.maps.LatLng(36.35,127.8),level:13});
 loadStores().catch(showError);
}
function showError(e){const x=document.getElementById('error');x.style.display='block';x.textContent='데이터를 불러오지 못했어요: '+e.message}
document.getElementById('q').addEventListener('input',render);
makeChips();
if(window.kakao&&kakao.maps) kakao.maps.load(initMap); else showError(new Error('카카오맵 SDK를 불러오지 못했습니다.'));
</script>
</body>
</html>
